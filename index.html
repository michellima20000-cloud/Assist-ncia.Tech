<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Assistência.Tech</title>
    <meta name="description" content="Sistema completo de gestão para assistência técnica de celulares e eletrônicos" />
    <meta property="og:title" content="Minha Assistência.Tech" />
    <meta property="og:description" content="Sistema completo de gestão para assistência técnica de celulares e eletrônicos" />
    <script>
      (function() {
        // Ensure window.fetch has a setter so third-party extensions do not crash with TypeError
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && !desc.set && desc.configurable) {
            var _curFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _curFetch; },
              set: function(val) { _curFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        var origError = console.error;
        var origWarn = console.warn;
        function isIgnoredError(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            if (!a) continue;
            var str = typeof a === 'string' ? a : (a && (a.message || a.stack || a.reason)) || String(a);
            if (typeof str === 'string') {
              var lower = str.toLowerCase();
              if (
                lower.indexOf('[vite]') !== -1 ||
                lower.indexOf('websocket closed without opened') !== -1 ||
                (lower.indexOf('websocket') !== -1 && lower.indexOf('failed to connect') !== -1) ||
                lower.indexOf('closed without opened') !== -1 ||
                lower.indexOf('chrome-extension://') !== -1 ||
                lower.indexOf('moz-extension://') !== -1 ||
                lower.indexOf('cannot set property fetch') !== -1
              ) {
                return true;
              }
            }
          }
          return false;
        }

        console.error = function() {
          if (isIgnoredError(arguments)) return;
          origError.apply(console, arguments);
        };

        console.warn = function() {
          if (isIgnoredError(arguments)) return;
          origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnoredError([event.reason, event])) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isIgnoredError([event.message, event.error, event.filename])) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
